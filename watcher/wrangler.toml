# hello-rss-watch: GitHub Actions の作業を決まった時刻に呼び出す Worker（時計の役）
# GH_TOKEN（GitHub のトークン）は、Cloudflare のダッシュボードで Worker に直接入れる。DISCORD_WEBHOOK_URL は watcher.yml が渡す
name = "hello-rss-watch"
main = "src/index.js"
compatibility_date = "2026-11-18"
workers_dev = false
preview_urls = false

[triggers]
# UTC。*/15 は公式の更新の検知、0 20 は 05:00 JST、0 9 は 18:00 JST
crons = ["*/15 * * * *", "0 20 * * *", "0 9 * * *"]

[vars]
GH_REPO = "yxmxgxn/hp-watch"

[observability]
enabled = true
