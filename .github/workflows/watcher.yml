name: watcher

# 時計の役の Worker（watcher/）を Cloudflare に公開する。
# GH_TOKEN（この Worker が GitHub の作業を呼び出すための、GitHub の fine-grained トークン）は、
# ここでは渡さない。Cloudflare のダッシュボードで Worker に直接入れる
# （hello-rss-watch → Settings → Variables and Secrets → Add → Secret、名前は GH_TOKEN）。デプロイしても消えない
on:
  push:
    branches: [main]
    paths: ["watcher/**", ".github/workflows/watcher.yml"]
  workflow_dispatch:

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: watcher
          command: deploy
          secrets: |
            DISCORD_WEBHOOK_URL
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
