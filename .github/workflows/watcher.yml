name: watcher

# 時計の役の Worker（watcher/）を Cloudflare に公開する。
# GH_TOKEN は、この Worker が GitHub の作業（rss / hpwatch / profiles）を呼び出すためのトークン
# （GitHub の Secrets では WATCHER_GITHUB_TOKEN。このリポジトリだけ・Actions の実行権限だけ）
on:
  push:
    branches: [main]
    paths: ["watcher/**", ".github/workflows/watcher.yml"]
  workflow_dispatch:

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: watcher
          command: deploy
          secrets: |
            GH_TOKEN
            DISCORD_WEBHOOK_URL
        env:
          GH_TOKEN: ${{ secrets.WATCHER_GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
