name: profiles

# プロフィール（特技・趣味・メンバーカラーなど）の差分を Discord に通知する。
# 毎日 18:00 JST に Cloudflare の Cron Trigger（watcher/）が手動実行として呼ぶ。スケジュールの通知（hpwatch）とは別の作業
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profiles
  cancel-in-progress: false

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: プロフィール（ハロプロ）
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python profiles.py --base https://helloproject.com --state state/profiles_helloproject.json --name ハロプロ

      - name: プロフィール（JPROOM）
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python profiles.py --base https://www.jp-r.co.jp --state state/profiles_jproom.json --name JPROOM

      - name: 状態をコミット
        if: always()
        run: |
          git add state
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "profiles state: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 3))
          done
          exit 1
