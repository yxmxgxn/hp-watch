name: rss

# 公式が更新されたとき（Cloudflare の Cron Trigger が検知して呼ぶ）と、毎朝 05:00 JST（今日の予定）に、Cloudflare から呼ばれて動く。
# 公開（wrangler deploy）で、フィード（public/）と、時計のコード（watcher/src/index.js・cron の設定）を一緒に送る。
# GitHub の cron（schedule）は使わない（遅れる・飛ぶことがあるため）。手で動かすときは workflow_dispatch
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss
  cancel-in-progress: false

jobs:
  rss:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 呼ばれた時点のコミットではなく、いまの main を取る。続けて2回呼ばれたとき（5:00 の定期と更新の検知が重なるなど）、
          # 後の実行が古い状態から始まって、状態のコミットが衝突するのを防ぐ
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: フィードを作る
        id: build
        run: python rss.py --out public --state-dir state

      - name: Cloudflare に公開
        # 片方のサイトでも失敗したら公開しない（そのサイトのフィードが消えるので）
        # トークン未登録の間は飛ばす
        if: steps.build.outcome == 'success' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: 状態をコミット
        if: always()
        run: |
          git add state
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "rss state: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 3))
          done
          exit 1
