# hello-rss（rss.py が public/ に書き出したフィードを、そのまま配る静的な Worker）
# デプロイは .github/workflows/rss.yml から。初回のデプロイで Worker とカスタムドメインの DNS が作られる
name = "hello-rss"
compatibility_date = "2026-11-18"

# 元の URL（hello-rss.○○.workers.dev）と試し用の URL は出さない。案内するのはカスタムドメインだけ。
# ダッシュボードのトグルで変えても、次のデプロイでここの値に戻る
workers_dev = false
preview_urls = false

[assets]
directory = "./public"

[[routes]]
pattern = "hello-rss.karin-archive.com"
custom_domain = true
